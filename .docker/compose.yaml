services:
  node-1:
    container_name: node-1
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    ports:
      - 127.0.0.1:50000:50000 # Wallet
      - 127.0.0.1:50001:50001 # Explorer
      - 127.0.0.1:50002:50002 # RPC
      - 127.0.0.1:50003:50003 # Admin RPC
      - 127.0.0.1:9001:9001 # TCP P2P
      - 127.0.0.1:6060:6060 # Debug
      - 127.0.0.1:9090:9090 # Metrics
    networks:
      - canopy
    command: ["start"]
    volumes:
      - ./volumes/node_1:/root/.canopy
#    deploy:
#      resources:
#        limits:
#          memory: 2G
#          cpus: "1.0"

  node-2:
    container_name: node-2
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    ports:
      - 127.0.0.1:40000:40000 # Wallet
      - 127.0.0.1:40001:40001 # Explorer
      - 127.0.0.1:40002:40002 # RPC
      - 127.0.0.1:40003:40003 # Admin RPC
      - 127.0.0.1:9002:9002 # TCP P2P
      - 127.0.0.1:6061:6060 # Debug
      - 127.0.0.1:9091:9090 # Metrics
    networks:
      - canopy
    command: ["start"]
    volumes:
      - ./volumes/node_2:/root/.canopy
